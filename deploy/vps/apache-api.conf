# /etc/apache2/sites-available/apache-api.conf
# DrillGuard PHP business API — serves backend/public with the existing .htaccess rewrite.
<VirtualHost *:80>
    ServerName api.DOMAIN
    DocumentRoot /var/www/drillguard/backend/public

    <Directory /var/www/drillguard/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM (adjust the socket to your PHP version)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/drillguard-api-error.log
    CustomLog ${APACHE_LOG_DIR}/drillguard-api-access.log combined
</VirtualHost>
# certbot --apache adds the :443 vhost + redirect.
