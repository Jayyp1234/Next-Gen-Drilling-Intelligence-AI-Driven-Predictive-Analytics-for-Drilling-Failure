# /etc/apache2/sites-available/apache-infer.conf
# DrillGuard inference API — reverse proxy to the uvicorn systemd service.
<VirtualHost *:80>
    ServerName infer.DOMAIN

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8099/
    ProxyPassReverse / http://127.0.0.1:8099/
    # Whole-well CSV scoring can take a few seconds on a small VPS.
    ProxyTimeout 120

    ErrorLog ${APACHE_LOG_DIR}/drillguard-infer-error.log
    CustomLog ${APACHE_LOG_DIR}/drillguard-infer-access.log combined
</VirtualHost>
# certbot --apache adds the :443 vhost + redirect.
